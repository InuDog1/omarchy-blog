name: Deploy to GitHub Pages

on:
  # 記事生成ワークフローが完了した直後にトリガー
  workflow_run:
    workflows: ["Auto Publish Reddit Blog Post"]
    types:
      - completed
  # main ブランチへの push 時にも自動デプロイ
  push:
    branches:
      - main
  # 手動デプロイもできるように残しておきます
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 記事生成が「成功」した時、push時、または手動実行(workflow_dispatch)の時のみ実行する安全対策
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexing:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch depth 2 so git diff HEAD~1 HEAD can detect the latest post
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Notify Google Indexing API & IndexNow
        env:
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: 'https://InuDog1.github.io/omarchy-blog'
        run: |
          python notify_index.py --git-diff

